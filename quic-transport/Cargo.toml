[package]
name = "occultation-quic"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "occultation_quic"
crate-type = ["cdylib"]

[dependencies]
bytes = "1.10"
jni = "0.21"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt-multi-thread", "time", "io-util", "sync", "macros"] }
