name: Occultation Android
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, moonlight-noir]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare persistent development signing key
        id: development-key
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.OCCULTATION_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OCCULTATION_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OCCULTATION_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OCCULTATION_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          retained_key="$RUNNER_TEMP/occultation-development.keystore"
          signer_dir="$RUNNER_TEMP/occultation-signer"
          mkdir -p "$signer_dir"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo '::error::Development signing secrets are missing. Run scripts/setup-development-signing.sh on a trusted machine, then rerun this workflow.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$retained_key"
          chmod 600 "$retained_key"
          keytool -list -keystore "$retained_key" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "OCCULTATION_DEV_KEYSTORE=$retained_key"
            echo "OCCULTATION_DEV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "OCCULTATION_DEV_KEY_ALIAS=$KEY_ALIAS"
            echo "OCCULTATION_DEV_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          if gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$signer_dir/assets.txt" 2>/dev/null && grep -qx 'development-signer.sha256' "$signer_dir/assets.txt"; then
            gh release download dev --repo "$GITHUB_REPOSITORY" --pattern development-signer.sha256 --dir "$signer_dir"
            test -s "$signer_dir/development-signer.sha256"
          fi
      - name: Test signing verification
        run: python3 -m unittest discover -s scripts -p 'test_development_signing.py' -v
      - name: Test, lint and build development APKs
        run: bash ./gradlew :app:testNonRoot_gameDebugUnitTest :app:lintNonRoot_gameDebug :app:assembleNonRoot_gameDebug --stacktrace
      - name: Verify development APK signing continuity
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-development-signing.py --apks app/build/outputs/apk/nonRoot_game/debug --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --expected "$RUNNER_TEMP/occultation-signer/development-signer.sha256"
      - name: Upload development APKs
        uses: actions/upload-artifact@v4
        with:
          name: Occultation-0.1.8-dev-APKs
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error
      - name: Publish downloadable development APKs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/moonlight-noir'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-apks
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import os
          root = Path('app/build/outputs/apk/nonRoot_game/debug')
          metadata = json.loads((root / 'output-metadata.json').read_text())
          for element in metadata['elements']:
              abi = next((f['value'] for f in element['filters'] if f['filterType'] == 'ABI'), 'universal')
              if abi not in ('universal', 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'):
                  raise SystemExit('Unexpected APK architecture')
              shutil.copy2(root / element['outputFile'], Path('release-apks') / f'Occultation-{abi}.apk')
          shutil.copy2(root / 'development-signer.sha256', Path('release-apks/development-signer.sha256'))
          Path('release-apks/dev-build.json').write_text(json.dumps({
              'version': '0.1.8-dev', 'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'certificate_sha256': (root / 'development-signer.sha256').read_text().strip()}, indent=2) + '\n')
          if not Path('release-apks/Occultation-universal.apk').is_file():
              raise SystemExit('Universal APK was not built')
          PY
          (cd release-apks && sha256sum *.apk dev-build.json development-signer.sha256 > SHA256SUMS)
          cat > release-notes.md <<EOF
          Occultation 0.1.8 development build

          - Retained development signing identity backed by repository Actions secrets; normal builds reject unexpected signer changes.
          - Earlier development APKs signed with the previous key must be uninstalled before installing this rotated-key build.
          - Debug-signed development APKs; not a production release.

          Download **Occultation-universal.apk** for any supported Android device or Waydroid, or choose the APK matching your CPU. Android 5.0 or newer is required.

          Source: $GITHUB_SHA
          Tests, lint, and build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit dev --repo "$GITHUB_REPOSITORY" --title 'Occultation 0.1.8 Development' --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Occultation 0.1.8 Development' --notes-file release-notes.md --prerelease --latest=false
          fi
          gh release upload dev release-apks/* --repo "$GITHUB_REPOSITORY" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Occultation-check-reports
          path: app/build/reports/
          if-no-files-found: ignore
