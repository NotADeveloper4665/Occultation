name: Occultation Emulator Smoke Tests

on:
  pull_request:
  push:
    branches: [main, moonlight-noir]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occultation-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Android API ${{ matrix.api-level }} launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install build SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleNonRoot_gameDebug --stacktrace

      - name: Boot emulator and verify app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find app/build/outputs/apk/nonRoot_game/debug -maxdepth 1 -name '*universal*.apk' -print -quit)"
            if [ -z "$apk" ]; then
              echo "::error::Universal debug APK was not produced"
              find app/build/outputs/apk/nonRoot_game/debug -maxdepth 1 -type f -print
              exit 1
            fi

            adb logcat -c
            adb install -r "$apk"
            package="io.github.notadeveloper4665.occultation.debug"
            launch_output="$(adb shell am start -W -n "$package/com.limelight.PcView" 2>&1)"
            printf '%s\n' "$launch_output"
            printf '%s\n' "$launch_output" | grep -q 'Status: ok'

            # Give startup/native initialization time to fail visibly before checking.
            sleep 10
            if ! adb shell pidof "$package" >/dev/null; then
              echo "::error::Occultation process exited after launch"
              adb logcat -d -t 2500
              exit 1
            fi

            sleep 3
            adb shell pidof "$package" >/dev/null

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p emulator-diagnostics
          adb logcat -d > emulator-diagnostics/logcat.txt 2>&1 || true
          adb shell dumpsys activity activities > emulator-diagnostics/activities.txt 2>&1 || true
          adb shell getprop > emulator-diagnostics/getprop.txt 2>&1 || true

      - name: Upload emulator diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api-level }}-diagnostics
          path: |
            emulator-diagnostics/
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
